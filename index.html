<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>pupupu</title>

<style>
body {
  margin: 0;
  background-color: black;
  overflow: hidden;
}

#progressBox {
  position: absolute;
  top: 60px;
  right: 20px;
  width: 250px;
  height: 20px;
  background: #333;
  border: 2px solid white;
  border-radius: 10px;
  overflow: hidden;
}

#progressBar {
  width: 0%;
  height: 100%;
  background: rgb(250, 175, 187);
  transition: 0.3s;
}

#square {
  width: 50px;
  height: 50px;
  position: absolute;
  transform: translate(-50%, -50%);
}

#square img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.heart {
  width: 50px;
  height: 50px;
  position: absolute;
  image-rendering: pixelated;
}

/* текст лічильника */
#scoreCounter {
  position: absolute;
  top: 20px;
  right: 20px;
  font-family: "Courier New", monospace;
  font-size: 20px;
  color: #ffffff;
  background: rgba(0, 0, 0, 0.5);
  padding: 8px 12px;
  border-radius: 8px;
}

/* текст історії */
#storyText {
  position: absolute;
  top: 20px;
  left: 20px;
  max-width: 300px;
  font-family: "Courier New", monospace;
  font-size: 18px;
  color: white;
  white-space: pre-line;
}
</style>
</head>

<body>
<div id = "progressBox">
  <div id = "progressBar"></div>
</div>
<div id="square">
  <img id="playerImg" src="saddog.PNG">
</div>

<div id="scoreCounter"></div>
<div id="storyText"></div>

<audio id="bgMusic"></audio>

<script>
const square = document.getElementById("square");
const playerImg = document.getElementById("playerImg");
const music = document.getElementById("bgMusic");
const storyElement = document.getElementById("storyText");
const scoreElement = document.getElementById("scoreCounter");
const progressBar = document.getElementById("progressBar");

const speed = 1;
const size = 50;
const minY = 150; // мінімальна висота для руху
const maxScore = 30; // кількість очок для переходу у сон
const time_heart = 100; // час появи серця в мілісекундах
const drainIntervalTime = 2000; // час, через який очки зменшуються під час перевантаження
const time_sleep = 13000; // час сну в мілісекундах
const dell_time_progress = time_sleep / maxScore; // час, через який прогрес зменшується під час перевантаження


let x = (window.innerWidth - size) / 2;
let y = (window.innerHeight - size) / 2;
let meaning_progress = 0; // лічильник прогресу


square.style.left = x + "px";
square.style.top = y + "px";

const normalImg = "saddog.PNG";
const hitImg = "happydog.PNG";

// =======================
// ЛІЧИЛЬНИК
// =======================
let score = 0;
let hearts_list = []; // масив для збереження сердець на екрані

function updateScore() {
  scoreElement.textContent = score;
}
updateScore();

// =======================
// СТАН
// =======================
let isTyping = false;
let lastSometimes = 0;
let lastOverload = 0;
let isFrozen = false;
let scoreDrainInterval = null;
let progressDrainInterval = null;

// =======================
// ТЕКСТ
// =======================
function typeText(text, speed = 40) {
  return new Promise(resolve => {
    storyElement.textContent = "";
    let i = 0;
    isTyping = true;

    function typing() {
      if (i < text.length) {
        storyElement.textContent += text[i];
        i++;
        setTimeout(typing, speed);
      } else {
        isTyping = false;
        resolve();
      }
    }
    typing();
  });
}
function updateProgressBar() {
  let progress = Math.min((meaning_progress / maxScore) * 100, 100);
  progressBar.style.width = progress + "%";
}

function eraseText(speed = 20) {
  return new Promise(resolve => {
    let text = storyElement.textContent;

    function erasing() {
      if (text.length > 0) {
        text = text.slice(0, -1);
        storyElement.textContent = text;
        setTimeout(erasing, speed);
      } else {
        resolve();
      }
    }
    erasing();
  });
}

// =======================
// СТАРТ ГРИ
// =======================

async function startStory() {
  await typeText(
    "Look at this poor puppy... without love he gets angry. Help make him happy, but don't overdo it."
  );
}
startStory();

// =======================
// ФАЗИ
// =======================
function collectObject() {
  meaning_progress++;
  score++;
  updateScore();
  updateProgressBar();
  updateStory();

}

async function updateStory() {
  if (isTyping || isFrozen) return;

  

  // КОЖНІ 20 ОЧОК → SOMETIMES
  if (score >= lastSometimes + 20) {
    lastSometimes += 20;

    await eraseText();
    await typeText("Sometimes love is too much...");
  }

  // КОЖНІ 30 ОЧОК → ПЕРЕГРУЗКА
  if (meaning_progress >= lastOverload + maxScore) { // scorre >= lastOverload + maxScore
    

    runPhase2();

  }
}

async function runPhase2() {
  await flashEffect();


  // паралельно
  showPhaseText();
  triggerOverloadPhase();
  clearProgressBar();
 
}

// =======================
// ЕФЕКТИ
// =======================
function flashEffect() {
  return new Promise(resolve => {
    const flash = document.createElement("div");
    flash.style.position = "fixed";
    flash.style.top = 0;
    flash.style.left = 0;
    flash.style.width = "100%";
    flash.style.height = "100%";
    flash.style.background = "white";
    flash.style.zIndex = "9999";

    document.body.appendChild(flash);

    setTimeout(() => {
      flash.remove();
      resolve();
    }, 300);
  });
}



async function showPhaseText() {
    await eraseText();

    await typeText("Oh... it seems he flopped down from exhaustion, be careful");

    // чекаємо 20 секунд
    await new Promise(resolve => setTimeout(resolve, 10000));

    // стираємо текст
    await eraseText();
}

function triggerOverloadPhase() {
  if (isFrozen) return;
  isFrozen = true;
  playerImg.src = "tireddog.PNG";
  if (scoreDrainInterval) clearInterval(scoreDrainInterval);
  scoreDrainInterval = setInterval(() => {
    if (score > 0) {
      score--;
      updateScore();
    }
  }, drainIntervalTime);

  setTimeout(() => {
    clearInterval(scoreDrainInterval);
    scoreDrainInterval = null;
    playerImg.src = normalImg;
    isFrozen = false;
  }, time_sleep);
}

function clearProgressBar() {

  if (progressDrainInterval) {
    clearInterval(progressDrainInterval);
  }

  progressDrainInterval = setInterval(() => {
    if (meaning_progress > 0) {
      meaning_progress--;
      updateProgressBar();
    } else {
      clearInterval(progressDrainInterval);
      progressDrainInterval = null;
    }
  }, dell_time_progress);

}

// =======================
// РУХ
// =======================
const keys = {};

document.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

setInterval(move, 4);

function move() {
  if (isFrozen) return;

  if (keys["w"] || keys["arrowup"]) {
    y -= speed;
  }
  if (keys["s"] || keys["arrowdown"]) {
    y += speed;
  }
  if (keys["a"] || keys["arrowleft"]) {
    x -= speed;
  }
  if (keys["d"] || keys["arrowright"]) {
    x += speed;
  }

  x = Math.max(size / 2, Math.min(x, window.innerWidth - size / 2));
  y = Math.max(minY, Math.min(y, window.innerHeight - size / 2));

  square.style.left = x + "px";
  square.style.top = y + "px";

  checkCollision();
}

// =======================
// СЕРЦЯ
// =======================
function spawnHeart() {
  if (hearts_list.length >= 10) return; // обмеження на кількість сердець на екрані
  const heart = document.createElement("img");
  heart.src = "heart.PNG";
  heart.classList.add("heart");
  hearts_list.push(heart);

  const hx = Math.random() * (window.innerWidth - size);
  const hy = Math.random() * (window.innerHeight - 200) + minY; 

  heart.style.left = hx + "px";
  heart.style.top = hy + "px";

  document.body.appendChild(heart);
}
setInterval(spawnHeart, time_heart); // кожні 3.5 секунди (3500 мс) з'являється нове серце

// =======================
// КОЛІЗІЯ
// =======================
function checkCollision() {
  const hearts = document.querySelectorAll(".heart");

  hearts.forEach(heart => {
    const hx = heart.offsetLeft;
    const hy = heart.offsetTop;

    if (
      x < hx + 50 &&
      x + 50 > hx &&
      y < hy + 50 &&
      y + 50 > hy
    ) {
      if (!isFrozen) {
  playerImg.src = hitImg;

  setTimeout(() => {
    if (!isFrozen) {
      playerImg.src = normalImg;
    }
  }, 1000);
}

      heart.remove();
      hearts_list.splice(hearts_list.indexOf(heart), 1); // видаляємо серце з масиву
      

      collectObject();
    }
  });
}

// =======================
// МУЗИКА
// =======================
const playlist = [
  "song1.mp3",
  "song2.mp3",
  "song3.mp3",
  "song4.mp3"
];

let currentTrack = 0;

function playMusic() {
  music.src = playlist[currentTrack];
  music.play();
}

music.addEventListener("ended", () => {
  currentTrack = (currentTrack + 1) % playlist.length;
  playMusic();
});

document.addEventListener("click", () => {
  if (music.paused) {
    music.volume = 0.3;
    playMusic();
  }
});
</script>

</body>
</html>
